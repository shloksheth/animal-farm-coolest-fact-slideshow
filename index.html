<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Farm Unknown Facts Slideshow</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #cover {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      background: white;
      color: #111;
      user-select: none;
    }

    #cover h1 {
      margin: 0 0 14px;
      font-size: clamp(36px, 7vw, 84px);
    }

    #cover p {
      margin: 0;
      font-size: clamp(18px, 2.3vw, 28px);
      color: #555;
    }

    #rickroll {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="cover">
    <div>
      <h1>Animal Farm Unknown Facts Slideshow</h1>
      <p>Click anywhere to go to the next Fact</p>
    </div>
  </div>

  <video id="rickroll" preload="auto" playsinline>
    <source src="rickroll.mp4" type="video/mp4">
  </video>

  <script>
    const cover = document.getElementById("cover");
    const video = document.getElementById("rickroll");

    async function startRickroll() {
      cover.style.display = "none";
      video.muted = false;
      video.volume = 1.0;
      video.currentTime = 0;

      try {
        if (video.requestFullscreen) {
          await video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } catch (e) {}

      try {
        await video.play();
      } catch (e) {
        cover.style.display = "flex";
      }
    }

    cover.addEventListener("click", startRickroll, { once: true });
  </script>
</body>
</html>
